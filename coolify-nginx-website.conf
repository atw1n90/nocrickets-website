server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/website;
    index index.html;

    location /shared/ {
        alias /usr/share/nginx/html/shared/;
    }

    location ~ ^/(connect|es/connect)/(index\.html)?$ {
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://connect.facebook.net; frame-src 'self' https://*.facebook.com https://*.fbcdn.net; connect-src 'self' https://n8n.nocrickets.co https://*.facebook.com https://graph.facebook.com; img-src 'self' data: https://*.facebook.com https://*.fbcdn.net" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
